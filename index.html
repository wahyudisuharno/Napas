<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 150px}

h2{font-size:18px;font-weight:700;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}

.hero small{opacity:.8}
.big{font-size:84px;line-height:.95;font-weight:800;letter-spacing:-2px}

.gauge i{display:block;height:100%;background:var(--accent);border-radius:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mute{color:var(--mute);font-size:13px}
.in{color:var(--good);font-weight:600}.out{color:var(--bad);font-weight:600}

.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:focus-visible,.nav button:focus-visible,.fab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}

.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600}
.seg button.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pick{display:grid;gap:8px}.pick button{text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer}
.pick button.on{border-color:var(--hero);box-shadow:inset 0 0 0 2px var(--hero)}
.pick b{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;background:none;border:0;padding:12px 4px;color:var(--mute);font-weight:600;font-size:13px;cursor:pointer}
.nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#10201E;font-size:30px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.toast{position:fixed;left:16px;right:16px;bottom:calc(140px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:9;font-size:14px}
.tip{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute);margin-top:8px}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
.hint{margin-top:4px;font-size:13px;color:var(--mute);min-height:0}
.steps{padding-left:20px;margin:0}.steps li{margin:10px 0}
details{border-top:1px solid var(--line);padding:10px 0}details:first-child{border-top:0}summary{cursor:pointer;font-weight:600}details .mute{margin-top:6px}
.wa{display:block;width:100%;text-align:center;text-decoration:none;background:#1FA855;color:#fff}.wa:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.gauge i{transition:width .5s}.btn,.fab{transition:transform .12s}.btn:active,.fab:active{transform:scale(.97)}}

.fab{background:radial-gradient(circle at 30% 22%,#FFE9AE 0%,#F5BD45 45%,#D9900F 100%);border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 24px rgba(217,144,15,.5),inset 0 2px 3px rgba(255,255,255,.7),inset 0 -4px 8px rgba(160,90,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.nav{background:var(--glass-card);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-top:1px solid var(--glass-line);box-shadow:0 -8px 24px rgba(0,0,0,.1)}

.sheet>div{border:1px solid var(--glass-line);box-shadow:0 -10px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6)}
.seg button{background:var(--glass)}

.pick button{background:var(--glass-card);box-shadow:var(--shadow)}
input,select{background:var(--input);box-shadow:inset 0 2px 4px rgba(0,0,0,.1)}
.tip{background:var(--glass)}
.pot .bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}.pot .bar i{background:linear-gradient(90deg,#2FB5A5,#16685E)}
.logo svg{width:100%;height:auto;display:block}
.toast{background:rgba(16,32,30,.9);color:#fff;border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
</style>

 return`<div class="sheet" style="align-items:center;padding:16px"><div data-stop style="border-radius:22px;max-width:420px"><div style="font-size:44px">${s.e}</div><h2 style="margin:8px 0 6px">${s.t}</h2><p class="mute" style="font-size:15px;margin:0 0 16px">${s.d}</p><div class="row"><span class="mute">${tour+1} / ${TOUR.length}</span><div style="display:flex;gap:8px"><button class="btn ghost sm" data-act="tclose">Tutup</button><button class="btn sm" data-act="tnext">${last?"Selesai":"Lanjut"}</button></div></div></div></div>`}

function LG(){try{return JSON.parse(localStorage.getItem("napas_lic"))||{}}catch(e){return{}}}
function LSv(o){try{localStorage.setItem("napas_lic",JSON.stringify(o))}catch(e){}}
async function verif(kode){
 const L=LG();if(!L.dev){L.dev=Math.random().toString(36).slice(2,10)+Date.now().toString(36);LSv(L)}
 try{const r=await(await fetch(LICENSE_URL+"?aksi=cek&kode="+encodeURIComponent(kode)+"&dev="+L.dev)).json();
  if(r.ok){LSv({...LG(),kode,sampai:r.sampai,paket:r.paket,checked:Date.now()});return{ok:true,sampai:r.sampai,paket:r.paket}}
  LSv({...LG(),kode:"",sampai:""});return{ok:false,msg:r.alasan}}
 catch(e){const c=LG();if(c.kode===kode&&c.sampai&&c.sampai>=today()&&Date.now()-c.checked<2592e5)return{ok:true,sampai:c.sampai,paket:c.paket,offline:true};return{ok:false,msg:"jaringan"}}}

 if(lic.ok&&S.setup&&!S.tourDone)tour=0;render()}

const P={
 desain:{n:"Desain",e:"🎨",item:"Proyek",pola:"Biasanya DP di awal, pelunasan saat file final. Catat DP sebagai “sudah dibayar” dan pelunasannya sebagai “belum dibayar”.",cat:["Langganan software","Aset & font","Internet","Makan","Lainnya"],pots:["Kebutuhan","Dana darurat","Pajak & aset","Bebas"],pct:[50,20,10,20]},

function calc(){
 const t=today(),m=t.slice(0,7);
 const paid=S.tx.filter(x=>x.type==="in"&&x.status==="paid"),outs=S.tx.filter(x=>x.type==="out"),wait=S.tx.filter(x=>x.type==="in"&&x.status==="wait");

 const days=burn>0?Math.max(0,Math.floor(saldo/burn)):null;
 return{saldo,burn,days,paidAll:sum(paid),wait,waitSum:sum(wait),late:wait.filter(x=>x.due&&x.due<t),
  mIn:sum(paid.filter(x=>x.date.startsWith(m))),mOut:sum(outs.filter(x=>x.date.startsWith(m)))};
}
function render(){
 const a=$("#app");
 if(!lic||!lic.ok){a.innerHTML=gateHtml();return}
 if(!S.setup){a.innerHTML=onboard();hints();return}
 const c=calc(),p=P[S.bidang];
 let h="";
 if(tab==="home"){
  const d=c.days,w=d===null?0:Math.min(100,d/90*100);
  const msg=d===null?"Isi pengeluaran wajib bulanan di Atur agar hitungan jalan.":d<14?"Genting: kurang dari dua minggu. Tagih piutang dulu.":d<30?"Hati-hati: belum sampai sebulan.":d<90?"Cukup aman. Target ideal: 90 hari.":"Napas panjang. Dana darurat sudah kuat.";
  h=`<div class="row" style="margin:4px 2px 14px"><h1 style="font-size:22px">Napas</h1><span class="mute">${p.e} ${p.n}</span></div>
  ${licBanner()}<div class="hero"><small>Uang cukup untuk</small>
   <div class="num big">${d===null?"–":d}<span>hari</span></div>
   <div class="gauge"><i style="width:${w}%"></i></div>
   <div>${msg}</div>
   <small>Saldo ${rp(c.saldo)} · pengeluaran sekitar ${rp(c.burn)}/hari</small></div>
  <div class="card row"><div><div class="mute">Masuk bulan ini</div><div class="in">${rp(c.mIn)}</div></div><div style="text-align:right"><div class="mute">Keluar bulan ini</div><div class="out">${rp(c.mOut)}</div></div></div>
  <div class="card"><div class="row"><b>Belum dibayar klien</b><span class="num" style="font-size:18px;font-weight:700">${rp(c.waitSum)}</span></div>
   <div class="mute">${c.wait.length?c.wait.length+" tagihan"+(c.late.length?` · <span class="late">${c.late.length} telat</span>`:""):"Tidak ada piutang."}</div>
   ${c.wait.length?`<button class="btn ghost sm" style="margin-top:10px" data-act="tab" data-v="piutang">Lihat dan tagih</button>`:""}</div>
  <h2>Pembagian dari bayaran masuk</h2><div class="card">
   ${p.pots.map((n,i)=>`<div class="pot"><div class="row"><span>${n} <span class="mute">${p.pct[i]}%</span></span><b>${rp(c.paidAll*p.pct[i]/100)}</b></div><div class="bar"><i style="width:${p.pct[i]*2}%"></i></div></div>`).join("")}
   <div class="mute">Angka ini panduan, bukan rekening. Uangnya tetap satu saldo, tapi jatah Bebas baru boleh dipakai santai.</div></div>
  <div class="card"><b>Bingung memakainya?</b><div class="mute" style="margin:4px 0 10px">Baca cara penggunaan, atau tanya langsung lewat WhatsApp.</div><div style="display:flex;gap:8px"><button class="btn ghost sm" style="flex:1" data-act="tab" data-v="bantuan">Cara penggunaan</button><span style="flex:1">${waBtn("Konsultasi WA",1)}</span></div></div>`;
 }
 if(tab==="piutang"){
  const l=[...c.wait].sort((x,y)=>(x.due||"9").localeCompare(y.due||"9"));
  h=`<h2>Piutang</h2><div class="card">${l.length?l.map(x=>`<div class="item"><div class="row"><b>${esc(x.label)}</b><b>${rp(x.amt)}</b></div>
   <div class="mute">${x.due?(x.due<today()?`<span class="late">Telat ${dd(today(),x.due)} hari</span>`:"Jatuh tempo "+tgl(x.due)):"Tanpa jatuh tempo"}</div>
   <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" data-act="lunas" data-id="${x.id}">Sudah dibayar</button><button class="btn ghost sm" data-act="tagih" data-id="${x.id}">Salin pesan tagih</button></div></div>`).join(""):`<div class="mute">Semua ${p.item.toLowerCase()} sudah dibayar. Tap + untuk mencatat yang baru.</div>`}</div>`;
 }
 if(tab==="riwayat"){
  const l=[...S.tx].sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);
  h=`<h2>Riwayat</h2><div class="card">${l.length?l.map(x=>`<div class="item row"><div><b>${esc(x.label)}</b><div class="mute">${tgl(x.date)}${x.type==="out"?" · "+esc(x.cat):x.status==="wait"?" · belum dibayar":""}</div></div>
   <div style="text-align:right"><span class="${x.type}">${x.type==="in"?"+":"-"}${rp(x.amt)}</span> <button class="x" aria-label="Hapus" data-act="del" data-id="${x.id}">×</button></div></div>`).join(""):`<div class="mute">Belum ada catatan. Tap + untuk mulai.</div>`}</div>`;
 }
 if(tab==="atur"){
  h=`<h2>Atur</h2><div class="card"><label for="sb">Bidang kerja</label><select id="sb">${Object.keys(P).map(k=>`<option value="${k}" ${k===S.bidang?"selected":""}>${P[k].e} ${P[k].n}</option>`).join("")}</select>
  <div class="tip">${p.pola}</div>
  <label for="sw">Pengeluaran wajib per bulan (Rp)</label><input id="sw" inputmode="numeric" value="${S.wajib?fmtN(S.wajib):""}">
  <label for="sa">Saldo awal (Rp)</label><input id="sa" inputmode="numeric" value="${S.awal?fmtN(S.awal):""}">
  <button class="btn" style="margin-top:16px;width:100%" data-act="saveset">Simpan</button></div>
  <button class="btn ghost" style="width:100%" data-act="reset">Hapus semua data</button>`;
 }
 if(tab==="bantuan"){h=`<button class="btn ghost sm" style="margin-top:8px" data-act="tour">Lihat tutorial singkat</button><h2>Cara penggunaan</h2><div class="card"><ol class="steps">
<li><b>Atur dulu.</b> Isi pengeluaran wajib per bulan dan uang yang ada sekarang di tab Atur. Dari sini hitungan “cukup untuk berapa hari” dibuat.</li>
<li><b>Catat uang masuk.</b> Tap +, pilih Pemasukan, isi nominal dan nama klien. Pilih “Sudah dibayar” kalau uangnya sudah diterima, atau “Belum dibayar” beserta jatuh tempo.</li>
<li><b>Catat uang keluar.</b> Tap +, pilih Pengeluaran, isi nominal dan kategori. Catat segera setelah belanja, jangan menumpuk.</li>
<li><b>Baca Beranda.</b> Angka hari adalah napas keuanganmu. Di bawah 14 hari genting, di bawah 30 hari hati-hati, 90 hari ke atas kuat.</li>
<li><b>Tagih piutang.</b> Buka tab Piutang, tap “Salin pesan tagih”, lalu tempel ke WhatsApp klien. Setelah dibayar, tap “Sudah dibayar”.</li>
<li><b>Pakai pembagian.</b> Tiap bayaran yang masuk dibagi ke beberapa pos. Anggap jatah Bebas sebagai satu-satunya uang yang boleh dipakai santai.</li></ol></div>
<h2>Khusus ${p.n}</h2><div class="card">${p.pola}</div>
<h2>Pertanyaan umum</h2><div class="card">
<details><summary>Bagaimana angka hari dihitung?</summary><div class="mute">Saldo dibagi pengeluaran per hari. Pengeluaran per hari diambil yang lebih besar antara pengeluaran wajib bulanan dibagi 30 dan rata-rata pengeluaran tercatat 30 hari terakhir.</div></details>
<details><summary>Bagaimana mencatat DP dan pelunasan?</summary><div class="mute">Catat DP sebagai pemasukan “Sudah dibayar”. Catat sisa pelunasannya sebagai pemasukan “Belum dibayar” dengan tanggal jatuh tempo. Saat klien melunasi, tap “Sudah dibayar” di tab Piutang.</div></details>
<details><summary>Salah catat, bagaimana?</summary><div class="mute">Buka Riwayat, tap × pada catatan itu, lalu catat ulang dengan angka yang benar.</div></details>
<details><summary>Apakah data saya aman?</summary><div class="mute">Data hanya tersimpan di browser perangkat ini. Kalau data browser dihapus atau ganti HP, catatan ikut hilang. Belum ada backup.</div></details></div>
<h2>Konsultasi</h2><div class="card"><div class="mute" style="margin-bottom:10px">Ada yang tidak jelas soal aplikasi, atau ingin memberi masukan? Tanya langsung lewat WhatsApp.</div>${waBtn("Konsultasi lewat WhatsApp")}</div>`}
 const piu=c.wait.length?` (${c.wait.length})`:"";
 a.innerHTML=h+`<button class="fab" aria-label="Catat transaksi" data-act="open">+</button>
 <nav class="nav"><div>${[["home","Beranda"],["piutang","Piutang"+piu],["riwayat","Riwayat"],["atur","Atur"],["bantuan","Bantuan"]].map(([k,n])=>`<button data-act="tab" data-v="${k}" class="${tab===k?"on":""}">${n}</button>`).join("")}</div></nav>`+(sheet?sheetHtml():"")+(tour!==null?tourHtml():"");hints();
}
function waBtn(t,sm){const m=encodeURIComponent("Halo, saya mau konsultasi soal aplikasi Napas. Bidang kerja saya: "+P[S.bidang].n+".");const c="btn wa"+(sm?" sm":"");
 return WA_NUMBER?`<a class="${c}" href="https://wa.me/${WA_NUMBER}?text=${m}" target="_blank" rel="noopener">${t}</a>`:`<button class="${c}" data-act="nowa">${t}</button>`}
function onboard(){
 const k=draft.b||S.bidang;
 return`<h1 style="font-size:30px;margin-top:10px">Napas</h1><p class="mute">Catatan keuangan untuk penghasilan yang naik turun. Pilih bidang kerjamu.</p>
 <div class="pick">${Object.keys(P).map(x=>`<button data-act="pickb" data-v="${x}" class="${x===k?"on":""}"><b>${P[x].e} ${P[x].n}</b><span class="mute">${P[x].pola}</span></button>`).join("")}</div>
 <label for="ow">Pengeluaran wajib per bulan (sewa, cicilan, makan)</label><input id="ow" inputmode="numeric" placeholder="3.000.000">
 <label for="oa">Uang yang ada sekarang</label><input id="oa" inputmode="numeric" placeholder="1.500.000">
 <button class="btn" style="margin-top:18px;width:100%" data-act="start">Mulai</button>`;
}
function sheetHtml(){
 const p=P[S.bidang],d=sheet,inn=d.type==="in";
 return`<div class="sheet" data-act="close"><div data-stop><div class="row"><h2 style="margin:0">Catat</h2><button class="x" data-act="close" aria-label="Tutup">×</button></div>
 <div class="seg" style="margin-top:12px"><button class="${inn?"on":""}" data-act="stype" data-v="in">Pemasukan</button><button class="${inn?"":"on"}" data-act="stype" data-v="out">Pengeluaran</button></div>
 <label for="f1">Nominal (Rp)</label><input id="f1" inputmode="numeric" autofocus value="${esc(d.amt||"")}" maxlength="16">
 <label for="f2">${inn?"Klien / "+p.item.toLowerCase():"Keterangan"}</label><input id="f2" value="${esc(d.label||"")}" placeholder="${inn?"Budi, logo toko":"Bensin"}">
 ${inn?`<label>Status</label><div class="seg"><button class="${d.status==="paid"?"on":""}" data-act="sstat" data-v="paid">Sudah dibayar</button><button class="${d.status==="wait"?"on":""}" data-act="sstat" data-v="wait">Belum dibayar</button></div>
 ${d.status==="wait"?`<label for="f3">Jatuh tempo</label><input id="f3" type="date" value="${d.due||""}">`:""}`
 :`<label for="f4">Kategori</label><select id="f4">${p.cat.map(c=>`<option ${c===d.cat?"selected":""}>${c}</option>`).join("")}</select>`}
 <button class="btn" style="margin-top:18px;width:100%" data-act="add">Simpan</button></div></div>`;
}
function keep(){const g=i=>{const e=$(i);return e?e.value:undefined};
 if(g("#f1")!==undefined){sheet.amt=g("#f1");sheet.label=g("#f2");if(g("#f3")!==undefined)sheet.due=g("#f3");if(g("#f4")!==undefined)sheet.cat=g("#f4")}}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}
const num=v=>parseInt(String(v||"").replace(/\D/g,"").slice(0,12))||0;
const fmtN=n=>n?Number(n).toLocaleString("id-ID"):"";
function words(n){for(const[v,w]of[[1e9,"miliar"],[1e6,"juta"],[1e3,"ribu"]])if(n>=v){const x=n/v,r=Math.round(x*100)/100;return(r===x?"= ":"≈ ")+"Rp"+String(r).replace(".",",")+" "+w}return"= Rp"+n}
function hint(t){let h=t.nextElementSibling;if(!h||!h.classList.contains("hint")){h=document.createElement("div");h.className="hint";t.after(h)}const n=num(t.value);h.textContent=n?words(n):""}
function hints(){document.querySelectorAll('input[inputmode="numeric"]').forEach(hint)}
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");
 if(e.target.closest("[data-stop]")&&!el)return;
 if(!el)return;
 if(el.classList.contains("sheet")&&e.target!==el)return;
 const a=el.dataset.act,v=el.dataset.v,id=+el.dataset.id;
 if(a==="pickb"){draft.b=v;draft.w=$("#ow").value;draft.a=$("#oa").value;S.bidang=v;render();$("#ow").value=draft.w;$("#oa").value=draft.a;hints()}
 else if(a==="start"){S.wajib=num($("#ow").value);S.awal=num($("#oa").value);S.setup=true;save();if(!S.tourDone){tour=0;tab="home"}render()}
 else if(a==="tab"){tab=v;render();window.scrollTo(0,0)}
 else if(a==="open"){sheet={type:"in",status:"paid",cat:P[S.bidang].cat[0]};render()}
 else if(a==="close"){sheet=null;render()}
 else if(a==="stype"){keep();sheet.type=v;render()}
 else if(a==="sstat"){keep();sheet.status=v;render()}
 else if(a==="add"){keep();const amt=num(sheet.amt);if(!amt||!String(sheet.label||"").trim()){toast("Isi nominal dan keterangan dulu.");return}
  const x={id:Date.now(),type:sheet.type,amt,label:sheet.label.trim(),date:today()};
  if(x.type==="in"){x.status=sheet.status;if(x.status==="wait")x.due=sheet.due||""}else x.cat=sheet.cat;
  S.tx.push(x);save();
  if(x.type==="in"&&x.status==="paid"){const p=P[S.bidang];toast("Dibagi: "+p.pots.map((n,i)=>n+" "+rp(amt*p.pct[i]/100)).join(" · "))}
  sheet=null;render()}
 else if(a==="lunas"){const x=S.tx.find(t=>t.id===id);if(x){x.status="paid";x.date=today();save();toast("Tercatat lunas: "+rp(x.amt));render()}}
 else if(a==="tagih"){const x=S.tx.find(t=>t.id===id);const m=`Halo, saya mengingatkan tagihan ${x.label} sebesar ${rp(x.amt)}${x.due?" (jatuh tempo "+tgl(x.due)+")":""}. Mohon konfirmasi jadwal pembayarannya ya. Terima kasih.`;
  (navigator.clipboard?navigator.clipboard.writeText(m):Promise.reject()).then(()=>toast("Pesan tagih tersalin."),()=>toast(m))}
 else if(a==="login"){const k=($("#kode").value||"").trim().toUpperCase();if(!k){toast("Isi kode akses dulu.");return}lic=null;render();verif(k).then(r=>{lic=r;if(r.ok&&S.setup&&!S.tourDone)tour=0;render()})}
 else if(a==="tour"){tour=0;tab="home";render()}
 else if(a==="tnext"){tour++;if(tour>=TOUR.length){tour=null;S.tourDone=true;save();tab="home"}else tab=TOUR[tour].tab;render()}
 else if(a==="tclose"){tour=null;S.tourDone=true;save();tab="home";render()}
 else if(a==="nowa"){toast("Nomor konsultasi belum tersedia.")}
 else if(a==="del"){S.tx=S.tx.filter(t=>t.id!==id);save();render()}
 else if(a==="saveset"){S.bidang=$("#sb").value;S.wajib=num($("#sw").value);S.awal=num($("#sa").value);save();toast("Tersimpan.");render()}
 else if(a==="reset"){if(confirm("Hapus semua data di perangkat ini?")){S={setup:false,bidang:"desain",wajib:0,awal:0,tx:[]};save();tab="home";render()}}
});
document.addEventListener("input",e=>{const t=e.target;if(t.tagName!=="INPUT"||t.getAttribute("inputmode")!=="numeric")return;
 const pos=t.selectionStart||0,digits=t.value.slice(0,pos).replace(/\D/g,"").length;
 t.value=fmtN(num(t.value));
 let c=0,n=0;while(c<t.value.length&&n<digits){if(/\d/.test(t.value[c]))n++;c++}
 try{t.setSelectionRange(c,c)}catch(_){}
 hint(t)});
document.addEventListener("change",e=>{if(e.target.id==="sb"){S.bidang=e.target.value;save();render();$("#sb").value=S.bidang}});
render();setupPWA();boot();
</script>
</body>
</html>
